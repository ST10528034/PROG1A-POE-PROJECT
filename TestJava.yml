name: Java CI (NetBeans Ant project)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download JUnit 4
        run: |
          mkdir -p lib out
          curl -sSL -o lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSL -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Compile source and test code
        run: javac -cp "lib/*" -d out $(find src test -name "*.java")

      - name: Run the unit tests
        run: java -cp "out:lib/*" org.junit.runner.JUnitCore poe.part.pkg1.MessageTest poe.part.pkg1.LoginTest
